name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from the "packageManager" field in package.json.
      # standalone: true uses pnpm's bundled Node so this step doesn't depend on
      # the runner's preinstalled Node version (which can be older than pnpm requires).
      - uses: pnpm/action-setup@v4
        with:
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time stubs so Next.js compiles without real credentials.
          # The Clerk key must be VALID FORMAT (Clerk validates it during
          # prerender of Clerk-wrapped pages, e.g. the admin app's /_not-found).
          # Decodes to "example.clerk.accounts.dev$" — format-valid, not a real account.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_stubstubstubstubstubstubstubstub
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_stub
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_stub
          NEXT_PUBLIC_POSTHOG_KEY: phc_stub
