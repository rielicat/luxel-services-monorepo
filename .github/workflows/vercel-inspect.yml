name: Vercel inspect (web)

# Read-only diagnostic: prints the luxel-web project's deploy-relevant settings
# so we can see WHY its Git integration stopped auto-deploying (e.g. paused,
# an Ignored Build Step command, or a broken git link). Manual trigger only;
# never mutates anything. Temporary — safe to delete once the deploy issue is
# resolved.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: GET luxel-web project (read-only)
        env:
          TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          TEAM: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN:-}" ]; then echo "VERCEL_API_TOKEN not set"; exit 1; fi
          Q=""
          if [ -n "${TEAM:-}" ]; then Q="?teamId=$TEAM"; fi
          resp=$(curl -sS -w $'\n%{http_code}' -H "Authorization: Bearer $TOKEN" \
            "https://api.vercel.com/v9/projects/luxel-web${Q}")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "HTTP $code"
          if [ "$code" != "200" ]; then echo "$body"; exit 1; fi
          printf '%s' "$body" | node -e '
            const p = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const link = p.link || {};
            const out = {
              name: p.name,
              paused: p.paused ?? null,
              gitType: link.type ?? null,
              repo: link.org ? (link.org + "/" + link.repo) : (link.repo ?? null),
              productionBranch: link.productionBranch ?? null,
              // The prime suspects for "linked but not building":
              commandForIgnoringBuildStep: p.commandForIgnoringBuildStep ?? null,
              deployHooks: (link.deployHooks || []).map(h => ({ name: h.name, ref: h.ref })),
              gitComments: link.gitComments ?? null,
              latestDeployment: (p.latestDeployments || []).slice(0, 1).map(d => ({
                state: d.readyState,
                target: d.target,
                branch: d.meta && d.meta.githubCommitRef,
                sha: (d.meta && d.meta.githubCommitSha || "").slice(0, 7),
                createdAt: d.createdAt && new Date(d.createdAt).toISOString(),
              }))[0] ?? null,
            };
            console.log(JSON.stringify(out, null, 2));
          '
