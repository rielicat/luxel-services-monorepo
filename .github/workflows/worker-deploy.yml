name: Worker deploy

on:
  push:
    branches: [main]
    paths: ['workers/whatsapp/**', '.github/workflows/worker-deploy.yml']
  workflow_dispatch: {}

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — require CLOUDFLARE_API_TOKEN
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping. Add it to auto-deploy the worker."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          standalone: true

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.skip != 'true'

      - name: Typecheck the worker
        if: steps.guard.outputs.skip != 'true'
        run: pnpm --filter @luxel/whatsapp-worker run typecheck

      - name: Deploy
        if: steps.guard.outputs.skip != 'true'
        run: pnpm --filter @luxel/whatsapp-worker run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
