name: Infra (Vercel)

# Fully CI-driven. On push to main (or manual dispatch) touching infra/vercel,
# CI seeds the stack config from the live web project, adopts the web project +
# creates/deploys the admin project on the first run, and applies changes on
# every run after. PRs get a `pulumi preview`. State is in the R2 backend.
on:
  push:
    branches: [main]
    paths: ['infra/vercel/**']
  pull_request:
    paths: ['infra/vercel/**']
  workflow_dispatch:

concurrency:
  group: infra-vercel-prod
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_REGION: auto
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
  VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
  ADMIN_SUPABASE_SECRET_KEY: ${{ secrets.ADMIN_SUPABASE_SECRET_KEY }}
  ADMIN_CLERK_SECRET_KEY: ${{ secrets.ADMIN_CLERK_SECRET_KEY }}
  PULUMI_SKIP_UPDATE_CHECK: 'true'
  CLOUD_URL: 's3://luxel-pulumi-state?endpoint=a592f6c9ed79454bf7c8ab489ece9036.r2.cloudflarestorage.com&s3ForcePathStyle=true'

jobs:
  # Skip (green) until the VERCEL_API_TOKEN secret exists.
  guard:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.c.outputs.ready }}
    steps:
      - id: c
        env:
          TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_API_TOKEN not set — add it as a repo secret. Skipping."
          fi

  vercel:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @luxel/infra-vercel typecheck
      - name: Install Pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
      - name: Preview or apply (bootstrap on first run)
        working-directory: infra/vercel
        run: |
          set -euo pipefail
          pulumi login "$CLOUD_URL"
          pulumi stack select prod 2>/dev/null || pulumi stack init prod
          node scripts/ci-seed.mjs

          # First run: web project not yet in state → adopt via import.
          if pulumi stack --show-urns 2>/dev/null | grep -q 'Project::web'; then
            ADOPT=0
          else
            ADOPT=1
            node scripts/gen-imports.mjs
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LUXEL_VC_ADOPT=$ADOPT pulumi preview
          else
            LUXEL_VC_ADOPT=$ADOPT pulumi up --yes --skip-preview
            node scripts/deploy-admin.mjs
          fi
