# Non-secret stack config. Auth is via the VERCEL_API_TOKEN env var.
# `web.name` (and `teamId` if the projects are on a Team) are set automatically
# in CI by scripts/discover-web.mjs; the admin app's shared secrets are set once
# in the Vercel dashboard, not here.
config:
  luxel-vercel:gitRepo: rielicat/luxel-services-monorepo
  luxel-vercel:productionBranch: main
  luxel-vercel:teamId: ''
  luxel-vercel:web:
    name: REPLACE_WITH_WEB_PROJECT_NAME
    rootDirectory: apps/web
  luxel-vercel:admin:
    name: luxel-admin
    rootDirectory: apps/admin
    domain: admin.serviciosluxel.cl
