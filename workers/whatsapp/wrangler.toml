name = "luxel-whatsapp-webhook"
main = "src/index.ts"
account_id = "a592f6c9ed79454bf7c8ab489ece9036"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
CLEANING_MEDIA_ORIGINS = "https://serviciosluxel.cl,https://www.serviciosluxel.cl"
LUXEL_APP_URL = "https://serviciosluxel.cl"

[[r2_buckets]]
binding = "CLEANING_MEDIA"
bucket_name = "luxel-cleaning-media"
preview_bucket_name = "luxel-cleaning-media-preview"

[[workflows]]
name = "cleaning-review"
binding = "CLEANING_REVIEW"
class_name = "CleaningReviewWorkflow"

[triggers]
crons = ["23 4 * * *"]

[[unsafe.bindings]]
name = "SEND_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "MEDIA_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
