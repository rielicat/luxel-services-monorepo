name = "luxel-whatsapp-webhook"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Secrets — set with `wrangler secret put <NAME>`:
#   WHATSAPP_VERIFY_TOKEN     (chosen by us; matched in Meta dashboard)
#   WHATSAPP_APP_SECRET       (Meta App secret — used to verify webhook signature)
#   WHATSAPP_ACCESS_TOKEN     (long-lived system user token)
#   WHATSAPP_PHONE_NUMBER_ID  (numeric phone number id from Meta)
#   SUPABASE_URL
#   SUPABASE_SECRET_KEY       (sb_secret_* — replaces the legacy service_role key)

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
